<!DOCTYPE html>
<html>
<head th:replace="layout/plantilla :: head">
    <meta charset="UTF-8">
    <title>[[#{docente.pagina}]]</title>
</head>
<body th:attr="data-abrir-modal=${abrirModal},
              data-municipio-placeholder=#{docente.municipio.seleccione},
              data-confirmar-titulo=#{docente.confirmar.titulo},
              data-confirmar-mensaje=#{docente.confirmar.mensaje},
              data-confirmar-baja=#{accion.baja},
              data-confirmar-alta=#{accion.alta},
              data-confirmar-cancelada=#{docente.confirmar.cancelada},
              data-confirmar-si=#{docente.confirmar.si},
              data-confirmar-no=#{docente.confirmar.no}">
<div th:replace="layout/plantilla :: navbar"></div>

<div class="d-flex justify-content-center">

    <div th:replace="layout/menu :: menu"></div>

    <main class="flex-grow-1">
        <section class="content">
            <div class="container-fluid">
                <div class="py-lg-2">
                    <div class="row clearfix">
                        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                            <div class="card shadow-lg bg-primary-subtle">
                                <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 p-4">

                                    <h2 class="fw-bold text-primary m-0">
                                        <i class="fa-solid fa-chalkboard-user"></i>
                                        [[#{docente.tabla}]]
                                    </h2>

                                    <a href="#"
                                            class="btn btn-primary btn-regis-custom d-flex align-items-center gap-2"
                                            data-bs-toggle="modal"
                                            data-bs-target="#modalD">
                                            <i class="fa-solid fa-plus"></i> [[#{boton.docente.crear}]]
                                    </a>

                                </div>
                                <div class="body card shadow-lg p-3">
                                    <div class="table-responsive dataTable">
                                        <table id="tablaDocentes"
                                               class="table table-hover align-middle table-custom text-center shadow-sm rounded"
                                               th:data-idioma="#{tabla.idioma}">

                                            <thead class="table-dark">
                                            <tr>
                                                <th class="py-3">[[#{tabla.docente.nomb}]]</th>
                                                <th class="py-3">[[#{tabla.docente.apell}]]</th>
                                                <th class="py-3">[[#{tabla.docente.esp}]]</th>
                                                <th class="py-3">[[#{tabla.opciones}]]</th>
                                            </tr>
                                            </thead>

                                            <tbody>
                                            <tr th:each="docente : ${docentes}"
                                                th:classappend="${!docente.activo} ? 'docente-inactivo' : ''">

                                                <td class="fw-semibold">
                                                    <span
                                                    th:text="${docente.persona.nombres}">
                                                    Mostrar Nombre
                                                    </span>

                                                    <span th:if="${!docente.activo}"
                                                    class="badge be-secondary ms-2">
                                                        [[#{tabla.etiqueta.inactivo}]]
                                                    </span>
                                                </td>


                                                <td class="fw-semibold"
                                                    th:text="${docente.persona.apellidos}">
                                                    Mostrar Apellido
                                                </td>


                                                <td>
                                                    <span class="badge bg-info text-dark px-3 py-2 rounded-pill shadow-sm"
                                                    th:text="${docente.especialidad.nombre}">
                                                     Mostrar Especialidad
                                                    </span>
                                                </td>


                                                <td>
                                                    <div class="d-flex justify-content-center gap-2">

                                                        <a class="btn btn-info option-custom btn-sm rounded-circle shadow option-btn"
                                                           th:href="@{'/ver/' + ${docente.id}}"
                                                           th:title="#{accion.ver}">
                                                            <i class="fa-solid fa-eye"></i>
                                                        </a>

                                                        <a th:if="${docente.activo}"
                                                           class="btn btn-warning option-custom btn-sm rounded-circle shadow option-btn"
                                                           th:href="@{'/editar/' + ${docente.id}}"
                                                           th:title="#{accion.editar}">
                                                            <i class="fa-solid fa-pen"></i>
                                                        </a>

                                                        <form th:action="@{/docente/cambiar-estado/{id}(id=${docente.id})}"
                                                        method="POST"
                                                        class="d-inline form-cambiar-estado"
                                                              th:attr="data-nombre=${docente.persona.nombres},
                                                                        data-apellido=${docente.persona.apellidos}">
                                                        <button type="submit"
                                                                class="btn option-custom btn-sm rounded-circle shadow option-btn"
                                                                th:classappend="${docente.activo} ? 'btn-danger' : 'btn-success'"
                                                                th:title="${docente.activo} ? #{accion.baja} : #{accion.alta}">
                                                            <i class="fa-solid"
                                                            th:classappend="${docente.activo} ? 'fa-thumbs-down' : 'fa-thumbs-up'"></i>
                                                        </button>
                                                        </form>
                                                    </div>
                                                </td>

                                            </tr>
                                            </tbody>

                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>
<div th:replace="docs/docente/agregar :: modalDocente"></div>

<div th:replace="layout/plantilla :: footer"></div>

<script th:src="@{/js/docente.js}"></script>
</body>
</html>
