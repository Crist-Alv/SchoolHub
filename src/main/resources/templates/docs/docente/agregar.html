<div th:fragment="modalDocente">

    <div class="modal fade"
         id="modalD"
         tabindex="-1"
         aria-labelledby="modalDocenteLabel"
         aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content shadow-lg rounded-4">

                <!-- HEADER -->
                <div class="modal-header bg-primary text-white">

                    <h4 class="modal-title fw-bold" id="modalDocenteLabel">

                        <i class="fa-solid"
                           th:classappend="${modoEditar} ? ' fa-pen-to-square' : ' fa-chalkboard-user'">
                        </i>

                        <span th:text="${modoEditar} ? #{modal.docente.editar} : #{boton.docente.crear}">
                            [[#{modal.docente.titulo}]]
                        </span>

                    </h4>

                    <button type="button"
                            class="btn-close btn-close-white"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <!-- FORM -->
                <form th:action="@{/docente/guardar}"
                      th:object="${docente}"
                      method="post">

                    <!-- ID oculto -->
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{persona.id}">
                    <input type="hidden" name="direccionId" th:value="${direccion.id}">

                    <div class="modal-body">

                        <!-- DATOS PERSONALES -->
                        <fieldset class="border rounded-3 p-4 mb-4">

                            <legend class="float-none w-auto px-3 text-primary fw-bold">
                                [[#{modal.subtitulo}]]
                            </legend>

                            <div class="row g-5">

                            <!-- DUI -->
                            <div class="col-md-2">
                                <label class="form-label fw-semibold">[[#{modal.dui}]] *</label>
                                <input type="text"
                                       th:field="*{persona.dui}"
                                       class="form-control"
                                       placeholder="00000000-0" required>
                            </div>

                            <!-- NIT -->
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">[[#{modal.nit}]]</label>
                                <input type="text"
                                       th:field="*{persona.nit}"
                                       class="form-control"
                                       placeholder="0000-000000-000-0">
                            </div>

                                <!-- NOMBRES -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.nombres}]] *</label>
                                    <input type="text"
                                           th:field="*{persona.nombres}"
                                           class="form-control"
                                           required>
                                </div>

                                <!-- APELLIDOS -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.apellidos}]] *</label>
                                    <input type="text"
                                           th:field="*{persona.apellidos}"
                                           class="form-control"
                                           required>
                                </div>

                                <!-- GÉNERO -->
                                <div class="col-md-4">
                                    <fieldset class="border rounded-3 p-2 mb-2">
                                        <legend class="float-none w-auto fw-semibold">[[#{modal.genero}]] *</legend>

                                        <div class="d-flex gap-3 mt-2">

                                            <div class="form-check">
                                                <input class="form-check-input"
                                                       type="radio"
                                                       th:field="*{persona.genero}"
                                                       th:value="#{modal.genero.masculino}" required>
                                                <label class="form-check-label">[[#{modal.genero.masculino}]]</label>
                                            </div>

                                            <div class="form-check">
                                                <input class="form-check-input"
                                                       type="radio"
                                                       th:field="*{persona.genero}"
                                                       th:value="#{modal.genero.femenino}">
                                                <label class="form-check-label">[[#{modal.genero.femenino}]]</label>
                                            </div>

                                        </div>
                                    </fieldset>
                                </div>

                                <!-- FECHA -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.fechanacimiento}]] *</label>
                                    <input type="date"
                                           th:field="*{persona.fechaNacimiento}"
                                           class="form-control" required>
                                </div>

                                <!-- ESTADO CIVIL -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.estadocivil}]] *</label>
                                    <select th:field="*{persona.estadoCivil}"
                                            class="form-select"
                                            required>
                                        <option value="">[[#{modal.estadocivil.ops}]]...</option>
                                        <option th:each="estado : ${estadosCiviles}"
                                                th:value="${estado.id}"
                                                th:text="${estado.nombre}">
                                        </option>
                                    </select>
                                </div>

                                <!-- ESPECIALIDAD -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.especialidad}]] *</label>
                                    <select th:field="*{especialidad}"
                                            class="form-select"
                                            required>
                                        <option value="">[[#{modal.especialidad.ops}]]...</option>
                                        <option th:each="especialidad : ${especialidades}"
                                                th:value="${especialidad.id}"
                                                th:text="${especialidad.nombre}">
                                        </option>
                                    </select>
                                </div>

                                <!-- CORREO -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.correo}]]</label>
                                    <input type="email"
                                           th:field="*{persona.correo}"
                                           class="form-control"
                                           th:placeholder="#{modal.correo.placeholder}">
                                </div>

                                <!-- TELÉFONO -->
                                <div class="col-md-2">
                                    <label class="form-label fw-semibold">[[#{modal.telefono}]] *</label>
                                    <input type="text"
                                           th:field="*{persona.telefono}"
                                           class="form-control"
                                           placeholder="0000-0000"
                                           required>
                                </div>

                                <!-- NACIONALIDAD -->
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">[[#{modal.nacionalidad}]] *</label>
                                    <input type="text"
                                           th:field="*{persona.nacionalidad}"
                                           class="form-control"
                                           required>
                                </div>

                                <!-- DEPARTEMENTO -->
                                <div class="col-sm-3">
                                    <label class="form-label fw-semibold">[[#{modal.departamento}]] *</label>
                                    <div class="input-group">
                                            <select id="departamento"
                                                    name="departamento.id"
                                                    class="form-select"
                                                    th:data-departamento="${direccion.departamento != null ? direccion.departamento.id : ''}"
                                                    required>
                                                <option value="">[[#{modal.departeamnto.ops}]]...</option>
                                                <option th:each="depto : ${departamentos}"
                                                        th:value="${depto.id}"
                                                        th:text="${depto.nombre}">
                                                </option>
                                            </select>
                                    </div>
                                </div>

                                <!-- MUNICIPIO -->
                                <div class="col-md-3">
                                    <label class="form-label fw-semibold">[[#{modal.munucipio}]] *</label>
                                    <div class="input-group">
                                        <select id="municipio"
                                                name="municipio.id"
                                                class="form-select"
                                                th:data-municipio="${direccion.municipio != null ? direccion.municipio.id : ''}"
                                                required>
                                            <option value="">[[#{modal.municipio.ops}]]...</option>

                                        </select>
                                    </div>
                                </div>

                                <!-- DIRECCIÓN -->
                                <div class="col-md-12">
                                    <label class="form-label fw-semibold">[[#{modal.direccion}]] *</label>
                                    <textarea name="direccionTexto"
                                              class="form-control"
                                              rows="3"
                                              th:text="${direccion.direccion}"
                                              required></textarea>
                                </div>

                            </div>
                        </fieldset>

                    </div>

                    <!-- FOOTER -->
                    <div class="modal-footer d-flex justify-content-between">

                        <small class="text-muted">
                            * [[#{modal.aviso}]]
                        </small>

                        <div class="d-flex gap-2">

                            <!-- GUARDAR / ACTUALIZAR -->
                            <button type="submit"
                                    class="btn"
                                    th:classappend="${modoEditar} ? 'btn-warning' : 'btn-success'">

                                <i class="fa-solid"
                                   th:classappend="${modoEditar} ? ' fa-pen-to-square' : ' fa-floppy-disk'">
                                </i>

                                <span th:text="${modoEditar} ? #{accion.editar} : #{accion.guardar}">
                                    [[#{accion.guardar}]]
                                </span>

                            </button>

                            <!-- LIMPIAR -->
                            <button type="reset"
                                    id="btnLimpiar"
                                    class="btn btn-secondary">
                                <i class="fa-solid fa-rotate-left"></i>
                                [[#{accion.limpiar}]]
                            </button>

                            <!-- CERRAR -->
                            <button type="button"
                                    class="btn btn-danger"
                                    data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark"></i>
                                [[#{accion.cerrar}]]
                            </button>

                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
